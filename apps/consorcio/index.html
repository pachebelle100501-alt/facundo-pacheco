<title>Consorcio al Día</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: app de una columna para celular, pestañas fijas abajo, hojas modales para detalle */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --fg:#14202b; --muted:#5d6b78; --line:#dde3e9;
  --accent:#1f5f8b; --accent-ink:#ffffff; --debt:#b4432c; --debt-bg:#fbe9e4; --ok:#2f7d4f; --ok-bg:#e3f3e9;
  --f-display:"Space Grotesk",system-ui,sans-serif; --f-body:"Inter",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f161d; --surface:#18222c; --fg:#e7edf2; --muted:#93a2b0; --line:#2a3743;
  --accent:#6fb0dc; --accent-ink:#0b1620; --debt:#f08a70; --debt-bg:#3a211b; --ok:#6fcf97; --ok-bg:#16301f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161d; --surface:#18222c; --fg:#e7edf2; --muted:#93a2b0; --line:#2a3743;
  --accent:#6fb0dc; --accent-ink:#0b1620; --debt:#f08a70; --debt-bg:#3a211b; --ok:#6fcf97; --ok-bg:#16301f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 96px}
h1,h2{font-family:var(--f-display);margin:0;text-wrap:balance}
h1{font-size:1.35rem}
h2{font-size:1.05rem}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.num{font-variant-numeric:tabular-nums}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px}
.big{font-family:var(--f-display);font-size:2rem;font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.stack{display:grid;gap:12px}
.split{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.split div{min-width:0}
.split .v{font-weight:600;font-size:.95rem}
input[type=search],input[type=number],input[type=text]{width:100%;font:inherit;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chip{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:10px 4px;display:grid;gap:2px;cursor:pointer;text-align:center}
.chip small{font-weight:500;font-size:.7rem;color:var(--muted)}
.chip.debe{background:var(--debt-bg);border-color:transparent}
.chip.debe small{color:var(--debt)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.pill{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.row:last-child{border-bottom:0}
.row .c{min-width:0;overflow-wrap:anywhere}
.row.total{font-weight:700}
.row label{display:flex;gap:10px;align-items:center;min-width:0;cursor:pointer}
.row input[type=checkbox]{width:22px;height:22px;accent-color:var(--ok);flex:none}
.row.pagado .c{color:var(--muted);text-decoration:line-through}
.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 14px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tag{font-size:.75rem;font-weight:600;padding:3px 8px;border-radius:999px}
.tag.debe{background:var(--debt-bg);color:var(--debt)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
.tabs button{font:inherit;font-weight:600;font-size:.85rem;background:none;border:0;color:var(--muted);padding:14px 4px;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.sheet{position:fixed;inset:0;background:rgba(10,20,30,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet .card{background:var(--surface);color:var(--fg);width:100%;max-width:640px;border-radius:16px 16px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-height:90vh;overflow:auto;display:grid;gap:12px}
.field{display:grid;gap:4px}
.field span{font-size:.82rem;color:var(--muted)}
.msg{white-space:pre-wrap;background:var(--bg);border-radius:10px;padding:12px;font-size:.9rem}
.note{font-size:.82rem;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:30}
.empty{padding:24px;text-align:center;color:var(--muted)}
@media (max-width:360px){.grid{grid-template-columns:repeat(3,1fr)}}
@media (prefers-reduced-motion:no-preference){.chip,.pill,.btn{transition:transform .08s}.chip:active,.btn:active{transform:scale(.97)}}
</style>

<div class="wrap">
  <section id="v-deudas" class="stack">
    <div class="head"><div><div class="eyebrow">Deuda total del edificio</div><div class="big num" id="tot">—</div></div><div class="note" id="sync">Cargando…</div></div>
    <div class="panel split num" id="totSplit"></div>
    <input type="search" id="q" placeholder="Buscar unidad (ej. 7D)" autocomplete="off" inputmode="text">
    <div class="filters">
      <button class="pill" id="f-all" aria-pressed="false">Todas</button>
      <button class="pill" id="f-debe" aria-pressed="true">Con deuda</button>
    </div>
    <div class="grid" id="grid"><div class="empty" style="grid-column:1/-1">Cargando las unidades…</div></div>
  </section>

  <section id="v-pagar" class="stack" hidden>
    <div class="head"><div><div class="eyebrow" id="pMes">Pagos a proveedores</div><div class="big num" id="pPend">—</div><div class="note">pendiente de pagar</div></div></div>
    <div class="panel split num" id="pSplit"></div>
    <div class="panel" id="pList"><div class="empty">Cargando…</div></div>
    <p class="note">Tildá cada servicio cuando lo pagás. Queda guardado.</p>
  </section>

  <section id="v-mes" class="stack" hidden>
    <div class="head"><div><div class="eyebrow" id="mTit">Resumen</div><div class="big num" id="mSaldo">—</div><div class="note">saldo de caja</div></div></div>
    <div class="panel"><h2>Ingresos</h2><div id="mIng"></div></div>
    <div class="panel"><h2>Egresos</h2><div id="mEgr"></div></div>
  </section>
</div>

<nav class="tabs" role="tablist">
  <button role="tab" id="t-deudas" aria-selected="true">Deudas</button>
  <button role="tab" id="t-pagar" aria-selected="false">Pagar</button>
  <button role="tab" id="t-mes" aria-selected="false">Mes</button>
</nav>

<div class="sheet" id="sheet" hidden><div class="card" id="card"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
const $=id=>document.getElementById(id);
const fmt=n=>"$ "+Math.round(n||0).toLocaleString("es-AR");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MES="2026-09";
let db=null, units=[], mes=null, filtro="debe", busy=false;

function toast(t){const el=$("toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2200)}
const tot=u=>(u.expensas||0)+(u.cochera||0)+(u.extraord||0);

// Tabs
const views=["deudas","pagar","mes"];
function show(v){views.forEach(x=>{$("v-"+x).hidden=x!==v;$("t-"+x).setAttribute("aria-selected",x===v)});try{localStorage.setItem("tab",v)}catch(e){}}
views.forEach(v=>$("t-"+v).onclick=()=>show(v));
try{const t=localStorage.getItem("tab");if(views.includes(t))show(t)}catch(e){}

$("f-all").onclick=()=>{filtro="all";renderUnits()};
$("f-debe").onclick=()=>{filtro="debe";renderUnits()};
$("q").oninput=renderUnits;

function renderUnits(){
  $("f-all").setAttribute("aria-pressed",filtro==="all");$("f-debe").setAttribute("aria-pressed",filtro==="debe");
  const s={e:0,c:0,x:0};units.forEach(u=>{s.e+=u.expensas||0;s.c+=u.cochera||0;s.x+=u.extraord||0});
  $("tot").textContent=fmt(s.e+s.c+s.x);
  $("totSplit").innerHTML=`<div><div class="eyebrow">Expensas</div><div class="v">${fmt(s.e)}</div></div><div><div class="eyebrow">Cocheras</div><div class="v">${fmt(s.c)}</div></div><div><div class="eyebrow">Gto. extraord.</div><div class="v">${fmt(s.x)}</div></div>`;
  const q=$("q").value.trim().toUpperCase().replace(/\s/g,"");
  let list=units.filter(u=>q?u.id.includes(q):(filtro==="all"||tot(u)>0));
  if(!units.length){$("grid").innerHTML='<div class="empty" style="grid-column:1/-1">Todavía no hay unidades cargadas.</div>';return}
  if(!list.length){$("grid").innerHTML='<div class="empty" style="grid-column:1/-1">No hay unidades que coincidan.</div>';return}
  $("grid").innerHTML=list.map(u=>`<button class="chip ${tot(u)>0?"debe":""}" data-u="${esc(u.id)}">${esc(u.id)}<small class="num">${tot(u)>0?fmt(tot(u)).replace("$ ","$"):"al día"}</small></button>`).join("");
  $("grid").querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>openUnit(b.dataset.u));
}

function mensaje(u){
  const t=tot(u);
  if(!t) return `Hola! La unidad ${u.id} no registra deuda al cierre de ${mesNombre()}. ¡Gracias!`;
  let m=`Hola! Te paso el detalle de la unidad ${u.id} al cierre de ${mesNombre()}:\n`;
  if(u.expensas) m+=`• Expensas: ${fmt(u.expensas)}\n`;
  if(u.cochera) m+=`• Cochera: ${fmt(u.cochera)}\n`;
  if(u.extraord) m+=`• Gastos extraordinarios: ${fmt(u.extraord)}\n`;
  return m+`Total adeudado: ${fmt(t)}`;
}
const mesNombre=()=>mes?.titulo||"septiembre 2026";

function openUnit(id){
  const u=units.find(x=>x.id===id);if(!u)return;const t=tot(u);
  $("card").innerHTML=`
    <div class="head"><div><div class="eyebrow">Unidad</div><h1>${esc(u.id)}</h1></div><span class="tag ${t?"debe":"ok"}">${t?"Debe":"Al día"}</span></div>
    <div><div class="row"><span>Expensas</span><b class="num">${fmt(u.expensas)}</b></div>
    <div class="row"><span>Cochera</span><b class="num">${fmt(u.cochera)}</b></div>
    <div class="row"><span>Gastos extraordinarios</span><b class="num">${fmt(u.extraord)}</b></div>
    <div class="row total"><span>Total</span><span class="num">${fmt(t)}</span></div></div>
    <div class="msg" id="msg"></div>
    <div class="btns"><button class="btn" id="bCopy">Copiar mensaje</button><button class="btn ghost" id="bPago">Registrar pago</button></div>
    <button class="btn ghost" id="bClose">Cerrar</button>`;
  $("msg").textContent=mensaje(u);
  $("bCopy").onclick=async()=>{try{await navigator.clipboard.writeText(mensaje(u));toast("Mensaje copiado")}catch(e){const r=document.createRange();r.selectNodeContents($("msg"));const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Texto seleccionado: copialo")}};
  $("bPago").onclick=()=>pagoForm(u);
  $("bClose").onclick=closeSheet;
  $("sheet").hidden=false;
}
function closeSheet(){$("sheet").hidden=true}
$("sheet").onclick=e=>{if(e.target.id==="sheet")closeSheet()};

function pagoForm(u){
  $("card").innerHTML=`
    <div><div class="eyebrow">Registrar pago</div><h1>Unidad ${esc(u.id)}</h1></div>
    <label class="field"><span>Expensas (debe ${fmt(u.expensas)})</span><input type="number" id="pE" min="0" inputmode="numeric" placeholder="0"></label>
    <label class="field"><span>Cochera (debe ${fmt(u.cochera)})</span><input type="number" id="pC" min="0" inputmode="numeric" placeholder="0"></label>
    <label class="field"><span>Gastos extraordinarios (debe ${fmt(u.extraord)})</span><input type="number" id="pX" min="0" inputmode="numeric" placeholder="0"></label>
    <label class="field"><span>Nota (opcional)</span><input type="text" id="pN" placeholder="Transferencia, efectivo…"></label>
    <div class="btns"><button class="btn" id="bSave">Guardar pago</button><button class="btn ghost" id="bBack">Volver</button></div>
    <p class="note" id="pErr"></p>`;
  $("bBack").onclick=()=>openUnit(u.id);
  $("bSave").onclick=async()=>{
    if(busy||!db)return;
    const v=k=>Math.max(0,Number($(k).value)||0);
    const e=v("pE"),c=v("pC"),x=v("pX");
    if(!e&&!c&&!x){$("pErr").textContent="Ingresá al menos un monto.";return}
    busy=true;$("bSave").textContent="Guardando…";
    try{
      await db.doc("unidades/"+u.id).update({expensas:Math.max(0,(u.expensas||0)-e),cochera:Math.max(0,(u.cochera||0)-c),extraord:Math.max(0,(u.extraord||0)-x),actualizado:new Date().toISOString()});
      await db.collection("pagos").add({unidad:u.id,expensas:e,cochera:c,extraord:x,nota:$("pN").value.slice(0,200),fecha:new Date().toISOString()});
      toast("Pago registrado");closeSheet();
    }catch(err){$("pErr").textContent="No se pudo guardar: "+(err?.message||"error")+". Revisá la conexión y probá de nuevo."}
    finally{busy=false;const b=$("bSave");if(b)b.textContent="Guardar pago"}
  };
}

function renderMes(){
  if(!mes){$("pList").innerHTML='<div class="empty">Todavía no hay resumen cargado.</div>';return}
  const eg=mes.egresos||[], ing=mes.ingresos||[];
  const tE=eg.reduce((a,b)=>a+(b.monto||0),0), pag=eg.filter(x=>x.pagado).reduce((a,b)=>a+(b.monto||0),0);
  const tI=ing.reduce((a,b)=>a+(b.monto||0),0)+(mes.saldoAnterior||0);
  $("pMes").textContent="Pagos a proveedores · "+mesNombre();
  $("pPend").textContent=fmt(tE-pag);
  $("pSplit").innerHTML=`<div><div class="eyebrow">Total</div><div class="v">${fmt(tE)}</div></div><div><div class="eyebrow">Pagado</div><div class="v">${fmt(pag)}</div></div><div><div class="eyebrow">Servicios</div><div class="v">${eg.filter(x=>x.pagado).length}/${eg.length}</div></div>`;
  $("pList").innerHTML=eg.map((x,i)=>`<div class="row ${x.pagado?"pagado":""}"><label><input type="checkbox" id="eg${i}" data-i="${i}" ${x.pagado?"checked":""}><span class="c">${esc(x.concepto)}</span></label><b class="num">${fmt(x.monto)}</b></div>`).join("")+`<div class="row total"><span>Total egresos</span><span class="num">${fmt(tE)}</span></div>`;
  $("pList").querySelectorAll("[data-i]").forEach(cb=>cb.onchange=()=>togglePago(+cb.dataset.i,cb.checked));
  $("mTit").textContent="Resumen "+mesNombre();
  $("mSaldo").textContent=fmt(tI-tE);
  $("mIng").innerHTML=ing.map(x=>`<div class="row"><span class="c">${esc(x.concepto)}</span><span class="num">${fmt(x.monto)}</span></div>`).join("")+`<div class="row"><span class="c">Saldo mes anterior</span><span class="num">${fmt(mes.saldoAnterior)}</span></div><div class="row total"><span>Total ingresos</span><span class="num">${fmt(tI)}</span></div>`;
  $("mEgr").innerHTML=eg.map(x=>`<div class="row"><span class="c">${esc(x.concepto)}</span><span class="num">${fmt(x.monto)}</span></div>`).join("")+`<div class="row total"><span>Total egresos</span><span class="num">${fmt(tE)}</span></div>`;
}
async function togglePago(i,val){
  if(busy||!db||!mes)return;busy=true;
  const eg=(mes.egresos||[]).map((x,j)=>j===i?{...x,pagado:val}:{...x});
  try{await db.doc("meses/"+MES).update({egresos:eg});toast(val?"Marcado como pagado":"Marcado como pendiente")}
  catch(e){toast("No se pudo guardar");renderMes()}
  finally{busy=false}
}

(async()=>{
  const timer=setTimeout(()=>{$("sync").textContent="Sin conexión con los datos"},10000);
  db=await window.claude?.use?.("db");
  if(!db){clearTimeout(timer);$("sync").textContent="Abrí con tu cuenta para ver los datos";return}
  db.collection("unidades").orderBy("orden").onSnapshot(s=>{clearTimeout(timer);units=s.docs.map(d=>({id:d.id,...d.data()}));$("sync").textContent="Actualizado";renderUnits()},()=>{clearTimeout(timer);$("sync").textContent="Error al leer los datos"});
  db.doc("meses/"+MES).onSnapshot(s=>{mes=s.exists?s.data():null;renderMes()},()=>{});
})();
</script>
